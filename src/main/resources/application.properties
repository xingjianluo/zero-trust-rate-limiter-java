server.port=8080

# ===== Adaptive rate limiter configuration =====
# Directory for local state files (policies.jsonl, bans.json). No external services.
rate-limiter.data-dir=data
# Degradation strategy when the counter/ban state is unavailable or too slow:
#   CLOSED = reject with 503 (FAIL_CLOSED_UNAVAILABLE / FAIL_CLOSED_TIMEOUT)
#   OPEN   = allow but flag the decision as degraded (reason DEGRADED_OPEN, header
#            X-RateLimit-Degraded: 1) and meter it separately; never silent.
rate-limiter.fail-strategy=CLOSED
# Latency threshold in milliseconds for a single state-store operation.
rate-limiter.store-timeout-millis=200
# TTL for request-id decision deduplication (same requestId always gets one verdict).
rate-limiter.dedup-ttl-millis=30000
# In-process decision ring buffer size used by GET /admin/decisions.
rate-limiter.decision-log-capacity=1024

# Logging: keep the adaptive decisions visible (requestId, inputs, verdict).
logging.level.com.github.xingjianluo=INFO
