server.port=0

# ===== 限流策略 =====
# 兼容配置：未配置 ratelimit.policy.tiers 时，由下列 window/limit/dimensions 生成单层配额
# 固定窗口长度
ratelimit.policy.window=1s
# 窗口内允许的最大累计消耗量（未配置权重时即请求条数）
ratelimit.policy.limit=10
# 限流维度，按顺序判定，首个超限维度生效：IP / USER / PATH / GLOBAL
ratelimit.policy.dimensions=IP

# 分层配额（可选，留空即沿用上面的单层旧行为）：
# 同一请求同时受每一层约束（如来源短窗口、来源长窗口、全局总量），全部满足才放行。
# 配置后将取代 window/limit/dimensions。示例（默认不启用，保持注释）：
# ratelimit.policy.tiers[0].dimension=IP
# ratelimit.policy.tiers[0].window=1s
# ratelimit.policy.tiers[0].limit=10
# ratelimit.policy.tiers[1].dimension=IP
# ratelimit.policy.tiers[1].window=10s
# ratelimit.policy.tiers[1].limit=50
# ratelimit.policy.tiers[2].dimension=GLOBAL
# ratelimit.policy.tiers[2].window=1s
# ratelimit.policy.tiers[2].limit=200

# 请求权重（可选）：按路径前缀配置单次请求消耗的配额量，最长前缀匹配；
# 未匹配到任何前缀的请求权重为 1（与旧行为一致）。调整只对之后新开始的窗口生效。
# 例如：普通查询权重 1，批量导出权重 10
# ratelimit.policy.weights./api/query=1
# ratelimit.policy.weights./api/export=10

# 客户端重试幂等窗口：同一 X-Request-Id 在该时长内重复到达时复用首次结论，不再访问状态存储
ratelimit.policy.idempotent-ttl=30s

# ===== 临时封禁 =====
ratelimit.ban.enabled=true
# 连续超限窗口数达到该值后升级为封禁（级别 1）
ratelimit.ban.threshold-windows=3
# 各级封禁时长；超出级别数时取最后一个值
ratelimit.ban.level-duration[0]=1m
ratelimit.ban.level-duration[1]=5m
ratelimit.ban.level-duration[2]=30m
# 解封后观察期：期内再犯则级别 +1 立即重封；期满未再犯则清零
ratelimit.ban.observe-window=10m
ratelimit.ban.reset-after-observe=true
# 封禁判定维度
ratelimit.ban.dimension=IP

# ===== 存储与降级 =====
# 封禁状态持久化文件（置空则仅内存，重启后封禁记录丢失）
ratelimit.storage.ban-state-file=./data/ban-state.json
# 配额计数持久化文件（置空则仅内存，重启后窗口用量清零；配置后重启可延续当前窗口用量）
ratelimit.storage.quota-state-file=./data/quota-state.json
# 单次存储调用超过该耗时即判定为超时并降级
ratelimit.storage.timeout=100ms
# 降级模式：FAIL_CLOSED（拒绝，503）/ FAIL_OPEN（放行并标记降级头）
ratelimit.storage.fail-mode=FAIL_CLOSED

logging.level.com.github.xingjianluo=INFO
