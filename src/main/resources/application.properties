server.port=0

# ===== 限流策略（旧配置：未配置 layers 时按下面单窗口参数为每个维度派生一层） =====
# 固定窗口长度
ratelimit.policy.window=1s
# 窗口内最大加权消耗量（未配置权重时即最大请求条数）
ratelimit.policy.limit=10
# 限流维度，兼容配置：IP / USER / PATH / GLOBAL（使用 layers 后本项仅用于派生缺省层）
ratelimit.policy.dimensions=IP

# ===== 分层配额（可选；非空时以 layers 为准，window/limit/dimensions 仅作缺省值） =====
# 示例：IP 短窗口 + GLOBAL 长窗口两条配额，全部满足才放行。默认不启用，保持与旧配置一致。
#ratelimit.policy.layers[0].name=ip-short
#ratelimit.policy.layers[0].dimension=IP
#ratelimit.policy.layers[0].window=1s
#ratelimit.policy.layers[0].limit=10
#ratelimit.policy.layers[0].drives-ban=true
#ratelimit.policy.layers[1].name=global-long
#ratelimit.policy.layers[1].dimension=GLOBAL
#ratelimit.policy.layers[1].window=10s
#ratelimit.policy.layers[1].limit=200
#ratelimit.policy.layers[1].drives-ban=false

# ===== 请求权重（可选）：命中路径的请求按 weight 消耗每层配额，未命中按 1 =====
# 匹配规则：路径精确相等优先；否则最长前缀匹配。
#ratelimit.policy.weights[0].path=/api/export
#ratelimit.policy.weights[0].weight=5

# ===== 临时封禁 =====
ratelimit.ban.enabled=true
# 连续超限窗口数达到该值后升级为封禁（级别 1）
ratelimit.ban.threshold-windows=3
# 各级封禁时长；超出级别数时取最后一个值
ratelimit.ban.level-duration[0]=1m
ratelimit.ban.level-duration[1]=5m
ratelimit.ban.level-duration[2]=30m
# 解封后观察期：期内再犯则级别 +1 立即重封；期满未再犯则清零
ratelimit.ban.observe-window=10m
ratelimit.ban.reset-after-observe=true
# 封禁判定维度（分层模式下，只有 drivesBan=true 的层会驱动升级）
ratelimit.ban.dimension=IP

# ===== 存储与降级 =====
# 封禁状态持久化文件（置空则仅内存，重启后封禁记录丢失）
ratelimit.storage.ban-state-file=./data/ban-state.json
# 配额计数持久化文件（置空则仅内存，重启后当前窗口用量清零）
ratelimit.storage.rate-state-file=./data/rate-state.json
# 单次存储调用超过该耗时即判定为超时并降级
ratelimit.storage.timeout=100ms
# 降级模式：FAIL_CLOSED（拒绝，503）/ FAIL_OPEN（放行并标记降级头）
ratelimit.storage.fail-mode=FAIL_CLOSED

# ===== 幂等重试缓存：同一 X-Request-Id 在 TTL 内重复到达直接返回首次结论，不再访问状态存储 =====
ratelimit.replay.enabled=true
ratelimit.replay.ttl=5s
ratelimit.replay.capacity=10000

logging.level.com.github.xingjianluo=INFO
