server.port=0

# ===== 限流策略 =====
# 固定窗口长度
ratelimit.policy.window=1s
# 窗口内最大请求数（按下列每个维度分别计数）
ratelimit.policy.limit=10
# 限流维度，按顺序判定，首个超限维度生效：IP / USER / PATH / GLOBAL
ratelimit.policy.dimensions=IP

# ===== 临时封禁 =====
ratelimit.ban.enabled=true
# 连续超限窗口数达到该值后升级为封禁（级别 1）
ratelimit.ban.threshold-windows=3
# 各级封禁时长；超出级别数时取最后一个值
ratelimit.ban.level-duration[0]=1m
ratelimit.ban.level-duration[1]=5m
ratelimit.ban.level-duration[2]=30m
# 解封后观察期：期内再犯则级别 +1 立即重封；期满未再犯则清零
ratelimit.ban.observe-window=10m
ratelimit.ban.reset-after-observe=true
# 封禁判定维度
ratelimit.ban.dimension=IP

# ===== 存储与降级 =====
# 封禁状态持久化文件（置空则仅内存，重启后封禁记录丢失）
ratelimit.storage.ban-state-file=./data/ban-state.json
# 单次存储调用超过该耗时即判定为超时并降级
ratelimit.storage.timeout=100ms
# 降级模式：FAIL_CLOSED（拒绝，503）/ FAIL_OPEN（放行并标记降级头）
ratelimit.storage.fail-mode=FAIL_CLOSED

logging.level.com.github.xingjianluo=INFO
